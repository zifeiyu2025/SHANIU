[package]
name = "shaniu"
version = "0.1.0"
description = "SHANIU - Windows 桌面 Agent Harness 客户端"
edition = "2021"

[lib]
name = "shaniu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 上游模板同名 feature：tauri-codegen 用它决定 `generate_context!` 内嵌前端资源
# 还是走 `build.devUrl`（`dev = cfg!(not(feature = "custom-protocol"))`）。
# 故意**不设 default**：一旦默认开启，任何 `cargo check/clippy/test` 都会要求
# `dist/` 已存在（tauri-codegen 在 frontendDist 缺失时直接 panic），而 CI 与本地
# 都是先跑 cargo 检查再 `pnpm build`。发布与手工构建按 docs/01 §9.4 启用本 feature。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 版本锁定见 docs/01-架构需求文档.md §6（Tauri 2.12.5）；tray-icon 为系统托盘所需 feature
tauri = { version = "=2.12.5", features = ["tray-icon"] }
# 「添加工作区」的系统「选择文件夹」对话框：官方插件（MIT/Apache-2.0），用原生对话框不自绘
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SH-072 view_image：PNG/JPEG 解码 + 长边缩放（MIT/Apache-2.0）。
# 只用得到这两个格式，关掉默认 features 避免把 webp/tiff 等解码器一起编进来。
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ulid = "3"
base64 = "0.22"                    # SH-092：UI 预览字节窗口过 IPC（MIT/Apache-2.0，lock 里已有同版本）
toml = "1.2"
# SH-091 技能系统：解析 SKILL.md YAML frontmatter（上游 skill-filesystem 用 yaml）。
# MIT/Apache-2.0；仓库此前无 YAML crate，避免手写解析器。
serde_yaml_ng = "0.10"
# M1 模型客户端（§6 已确认）：HTTP/SSE 与流处理
reqwest = { version = "0.12", features = ["stream", "json"] }
eventsource-stream = "0.2"
futures = "0.3"
# M1 工具系统（§6 声明，按需引入策略）：异步 trait 对象化 / 取消令牌（ADR-001）/
# gitignore 感知文件遍历（ripgrep 引擎）/ 错误定义 / 正则
async-trait = "0.1"
tokio-util = "0.7"
ignore = "0.4"
thiserror = "2"
regex = "1"
# 异步运行时（tauri 内含；此处直连以获得 #[tokio::test]、进程/超时等能力）
# net/sync 为 SH-094 loopback WebSocket gateway 所需（TcpListener + broadcast/mpsc）
tokio = { version = "1", features = ["macros", "rt", "process", "io-util", "time", "net", "sync"] }
# SH-094 数据面传输：loopback WebSocket gateway（ADR-005）。MIT，按会话多路复用 +
# credit 背压 + event_id 续播；取代无背压的 Tauri 全局广播。
tokio-tungstenite = "0.26"
# SH-042 日志面（docs/01 §9.3 目录表要求 logs\ 按天滚动、保留 14 天、落盘前统一脱敏）。
# 三者同族、均 MIT：
#   tracing            — 事件门面；reqwest/tower 这些依赖本身就在发 tracing 事件，
#                        用 log 系就得再搭一层桥，等于自造适配。
#   tracing-subscriber — 自定义 MakeWriter 是"落盘前唯一收口"的官方扩展点，
#                        脱敏挂在这一层就漏不掉了（比逐处调用 redact() 可靠）。
#   tracing-appender   — 按天滚动文件名与目录创建已由社区实现，无需手写。
# 移除成本：三者只在 config.rs 的日志初始化处出现，换实现改一个函数。
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
# SH-114 批 2 会话日志 ZIP 导出：宿主侧流式压缩，避免整个归档在 WebView 内存里成形。
# `default-features = false` 只留 deflate——默认 feature 会拖进 bzip2/zstd/aes 这些
# 本卡用不到的压缩后端与 C 依赖。DEFLATE 等级 6 对齐上游 archive.ts 的默认值。MIT。
zip = { version = "9", default-features = false, features = ["deflate"] }
# SH-113 会话全文搜索：宿主侧 SQLite FTS5 派生索引（独立可丢弃的只读派生库）。
# `bundled` 让 libsqlite3-sys 编译 SQLite amalgamation 并带 -DSQLITE_ENABLE_FTS5
# （rusqlite 没有独立 fts5 feature，unicode61 tokenizer 是 FTS5 内置）。MIT 许可。
rusqlite = { version = "0.37", features = ["bundled"] }
# DPAPI（config.rs 密钥存取，§6 已确认方案）：微软官方 Win32 绑定，最小 feature 面
# M2-c 沙箱：RestrictedToken（Security）+ JobObject + 进程创建（Threading）
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security",
    # SH-021/022：AppContainer profile 生命周期（Isolation）与目录 DACL 读写（Authorization）
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    # 子进程输出编码判定：MultiByteToWideChar + GetOEMCP（GBK 回退）
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    # SH-070：ConPTY（CreatePseudoConsole / ClosePseudoConsole / COORD）
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    # 系统提示的环境声明：本地时间（SystemInformation::GetLocalTime）与时区偏移（Time）
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    # 输入框右键菜单的系统剪贴板读写（DataExchange/Memory 为 API 本体，Ole 提供 CF_UNICODETEXT）
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # SH-092 批 3：open-in-app 的注册表关联查询与应用启动
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# SH-060 MCP 客户端：可执行文件哈希（批准记录 / 启动前校验 / 重启前复核同源）。
# 纯 Rust 实现（RustCrypto，MIT/Apache-2.0）；lock 里已有传递依赖，这里提升为直接依赖。
sha2 = "0.10"
# SH-061 分发名消歧：codex 的 `_<sha1(raw)[..12]>` 双端短哈希（RustCrypto，MIT/Apache-2.0）。
# lock 里已有传递依赖，这里提升为直接依赖。
sha1 = "0.10"
# SH-062 注入检测前的文本规范化（docs/02 §3.1.2 A-R2 要求 NFKC）。
# MIT/Apache-2.0；仓库此前没有 Unicode 归一化实现，手写不现实。
unicode-normalization = "0.1"
# SH-060 输出包裹 nonce：server 不可预测的 128 位随机数，必须取 OS 熵。
# MIT/Apache-2.0；lock 里已有同名 crate（0.3.4），这里提升为直接依赖。
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
strip = true
