[approval]
mode = "never"
allow_prefixes = [
    "cargo build",
    "cargo check",
    "cargo clippy",
    "cargo test",
    "cargo metadata",
    "git status",
    "git diff",
    "git log",
    "git show",
    "git blame",
    "dir",
    "type",
    "findstr",
]

[workspace]
root = 'D:\MyWorkspace\SHANIU\docs\evidence\2026-11-12\write-only-default\workspace'
title = ""
hidden = false

[agent]
