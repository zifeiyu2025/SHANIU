name: Evals

# 评估基线定时回归（docs/05 SH-028 验收项、docs/04 §6.5、AGENTS.md §5）。
#
# 为什么单独一条 workflow 而不是塞进 CI：
#   - 要出网打真实端点、要花额度、单次十几分钟，PR 门禁里跑等于把交付管线绑在模型可用性上；
#   - AGENTS §5 的判据是"指标退化 >10% 不得合并"，那是**回归门禁**，不是**构建门禁**。
#
# 密钥口径（用户已批准注入 LongCat）：
#   SHANIU_EVAL_API_KEY 走仓库 Secrets，永不写进日志与提交；workflow 里只做存在性检查，
#   缺失时**判失败**而不是跳过——"今天定时跑了但没测"比"没跑"更危险，因为它会给出绿的假象。
#   fork 场景用 repository 判断直接退出，不去碰上游密钥。
#
# 触发：手动 workflow_dispatch。
# 定时触发已停用（2026-11-09）：GitHub 账单到顶后 schedule 每天产出 3 秒的红 run，
# 稀释真实信号、让人开始无视红点。账单恢复后按需取消注释。
#
# 职责边界（2026-11-09 用户定）：
#   - 这条 workflow 是**冒烟/回归探针**：双臂 × 1 轮 × 14 题，只拦「易题失败」；
#   - **不做统计结论**：1 轮没有分辨力，报告头打印"非基线、不做统计结论、不用于判退化"；
#   - 统计实验（双臂 × 5 轮）是**本地手动动作**，不是 CI 职责（docs/05 SH-073 注）。

on:
  # schedule:
  #   - cron: "10 3 * * *"   # 账单恢复后按需开启
  workflow_dispatch:
    inputs:
      model:
        description: 覆盖评估模型（留空用 tasks 默认 deepseek-flash）
        required: false
        default: ""

jobs:
  baseline:
    # fork / 镜像 / Dependabot 都不跑：Dependabot 的 PR 在同仓库里 head.repo.fork 为 false，
    # 只看 fork 标志会漏掉它，然后密钥为空、任务自跳过并报绿（业界把它列为密钥外泄的
    # 教科书路径，也绝不用 pull_request_target）。
    if: >
      github.repository == 'zifeiyu2025/SHANIU' &&
      (github.event_name != 'pull_request' ||
       (!github.event.pull_request.head.repo.fork &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    permissions:
      contents: read
    concurrency:
      group: evals-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    # 14 题 × 1 轮 × 两臂 = 28 样本，实测 ~55s/题，编译 ~5 分钟，留两倍余量。
    timeout-minutes: 60

    env:
      SHANIU_TEST_PROVIDER: openai-chat
      SHANIU_TEST_BASE_URL: https://api.longcat.chat/openai/v1
      # 默认按用户指示打 LongCat；手动触发时可用 inputs.model 覆盖
      SHANIU_TEST_MODEL: ${{ github.event.inputs.model || 'LongCat-2.5' }}

    steps:
      - uses: actions/checkout@v7

      - name: 校验评估密钥存在（缺失即失败，不给假绿）
        env:
          EVAL_KEY: ${{ secrets.SHANIU_EVAL_API_KEY }}
        run: |
          if [ -z "$EVAL_KEY" ]; then
            echo "::error::仓库未配置 SHANIU_EVAL_API_KEY，定时评估没有真正执行。宁可红，不假绿。"
            exit 1
          fi
          echo "密钥已就位（长度 ${#EVAL_KEY}，值不落日志）"
        shell: bash

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 角色分离（2026-11-09）：易题是"还能不能干活"的报警器，不是能力指标——
      # 工具链断了、读文件坏了、审批炸了，最先红的必须是它们。所以易题**必须跑且红了要拦**，
      # 由 SHANIU_EVAL_SMOKE=1 在运行器里断言；难题失败只记录、不拦。
      # 两臂都跑：对照臂同时验证"关掉自愈"这条装配路径没坏。
      # 两臂数字**不用于判退化**：1 轮没有分辨力，判退化要 5 轮（本地手动）。
      - name: 冒烟·对照臂（关自愈）
        working-directory: src-tauri
        env:
          SHANIU_TEST_API_KEY: ${{ secrets.SHANIU_EVAL_API_KEY }}
          SHANIU_EVAL_ROLE: control
          SHANIU_EVAL_ABLATE_AR6: "1"
          SHANIU_EVAL_SMOKE: "1"
          SHANIU_EVAL_REPEATS: "1"
        run: cargo test --test evals_baseline -- --ignored --nocapture

      - name: 冒烟·实验臂（开自愈）
        working-directory: src-tauri
        env:
          SHANIU_TEST_API_KEY: ${{ secrets.SHANIU_EVAL_API_KEY }}
          SHANIU_EVAL_ROLE: treatment
          SHANIU_EVAL_SMOKE: "1"
          SHANIU_EVAL_REPEATS: "1"
        run: cargo test --test evals_baseline -- --ignored --nocapture

      - name: 跑 FF-5 真实端点首增量口径
        working-directory: src-tauri
        env:
          SHANIU_TEST_API_KEY: ${{ secrets.SHANIU_EVAL_API_KEY }}
        # 推理档超 3s 预算是已知事实（docs/05 SH-075 性能工单），阈值口径定下来之前
        # 只记录不阻断：continue-on-error 让报告照常上传，红绿由上面的基线门禁决定
        continue-on-error: true
        run: cargo test --test latency_budget -- --ignored --nocapture

      - name: 装 Node（评分脚本用）
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 只打印、不判定：1 轮没有分辨力，两臂数字不同不代表退化。
      # 红绿由上面的冒烟步骤（易题门禁）决定；这里 continue-on-error 是为了不让
      # "两臂数字不同"变成假红灯，同时 score.mjs 自身崩溃仍会出现在日志里。
      - name: 打印两臂对照（探索模式，不做结论、不阻断）
        continue-on-error: true
        shell: bash
        run: |
          treatment=$(ls -t evals/results/*-treatment.json | head -1)
          control=$(ls -t evals/results/*-control.json | head -1)
          echo "实验臂=$treatment 对照臂=$control"
          echo "注意：本次为冒烟（每臂 1 轮），以下数字不用于判退化，统计结论需本地 5 轮手动实验"
          node evals/score.mjs "$treatment" "$control" --exploratory

      - name: 上传本轮报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-results
          # 运行器写的是 evals/results/<epoch>-<pid>-<role>.json；latest.json 从不存在
          path: evals/results/*.json
          if-no-files-found: warn
          retention-days: 30
