name: Evals

# 评估基线定时回归（docs/05 SH-028 验收项、docs/04 §6.5、AGENTS.md §5）。
#
# 为什么单独一条 workflow 而不是塞进 CI：
#   - 要出网打真实端点、要花额度、单次十几分钟，PR 门禁里跑等于把交付管线绑在模型可用性上；
#   - AGENTS §5 的判据是"指标退化 >10% 不得合并"，那是**回归门禁**，不是**构建门禁**。
#
# 密钥口径（用户已批准注入 LongCat）：
#   SHANIU_EVAL_API_KEY 走仓库 Secrets，永不写进日志与提交；workflow 里只做存在性检查，
#   缺失时**判失败**而不是跳过——"今天定时跑了但没测"比"没跑"更危险，因为它会给出绿的假象。
#   fork 场景用 repository 判断直接退出，不去碰上游密钥。
#
# 触发：每日 03:10 UTC（避开 Actions 整点高峰，cron 抖动小）+ 手动 workflow_dispatch。

on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: 覆盖评估模型（留空用 tasks 默认 deepseek-flash）
        required: false
        default: ""

jobs:
  baseline:
    # fork / 镜像 / Dependabot 都不跑：Dependabot 的 PR 在同仓库里 head.repo.fork 为 false，
    # 只看 fork 标志会漏掉它，然后密钥为空、任务自跳过并报绿（业界把它列为密钥外泄的
    # 教科书路径，也绝不用 pull_request_target）。
    if: >
      github.repository == 'zifeiyu2025/SHANIU' &&
      (github.event_name != 'pull_request' ||
       (!github.event.pull_request.head.repo.fork &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    permissions:
      contents: read
    concurrency:
      group: evals-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    # 8 题难样本 × 5 次 = 每臂 40 样本（两臂共 80），实测 ~55s/题，留足编译与重试余量。
    timeout-minutes: 120

    env:
      SHANIU_TEST_PROVIDER: openai-chat
      SHANIU_TEST_BASE_URL: https://api.longcat.chat/openai/v1
      # 默认按用户指示打 LongCat；手动触发时可用 inputs.model 覆盖
      SHANIU_TEST_MODEL: ${{ github.event.inputs.model || 'LongCat-2.5' }}

    steps:
      - uses: actions/checkout@v4

      - name: 校验评估密钥存在（缺失即失败，不给假绿）
        env:
          EVAL_KEY: ${{ secrets.SHANIU_EVAL_API_KEY }}
        run: |
          if [ -z "$EVAL_KEY" ]; then
            echo "::error::仓库未配置 SHANIU_EVAL_API_KEY，定时评估没有真正执行。宁可红，不假绿。"
            exit 1
          fi
          echo "密钥已就位（长度 ${#EVAL_KEY}，值不落日志）"
        shell: bash

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 分母必须是**当日对照**，不是冻结基线：端点漂移实测能把整份基线抬升 32%/轮
      # （evals/score.mjs 文件头已写明），冻结点不是同一把尺子。所以这里跑两臂、
      # 显式把两份报告交给 score.mjs——不再依赖永不入库的 evals/control.json。
      # 只跑难样本子集：6 道易题长期 100%，对退化没有分辨力，白烧额度。
      - name: 跑对照臂（关自愈）
        working-directory: src-tauri
        env:
          SHANIU_TEST_API_KEY: ${{ secrets.SHANIU_EVAL_API_KEY }}
          SHANIU_EVAL_ROLE: control
          SHANIU_EVAL_ABLATE_AR6: "1"
          SHANIU_EVAL_HARD_ONLY: "1"
          SHANIU_EVAL_REPEATS: "5"
        run: cargo test --test evals_baseline -- --ignored --nocapture

      - name: 跑实验臂（开自愈）
        working-directory: src-tauri
        env:
          SHANIU_TEST_API_KEY: ${{ secrets.SHANIU_EVAL_API_KEY }}
          SHANIU_EVAL_ROLE: treatment
          SHANIU_EVAL_HARD_ONLY: "1"
          SHANIU_EVAL_REPEATS: "5"
        run: cargo test --test evals_baseline -- --ignored --nocapture

      - name: 跑 FF-5 真实端点首增量口径
        working-directory: src-tauri
        env:
          SHANIU_TEST_API_KEY: ${{ secrets.SHANIU_EVAL_API_KEY }}
        # 推理档超 3s 预算是已知事实（docs/05 SH-075 性能工单），阈值口径定下来之前
        # 只记录不阻断：continue-on-error 让报告照常上传，红绿由上面的基线门禁决定
        continue-on-error: true
        run: cargo test --test latency_budget -- --ignored --nocapture

      - name: 装 Node（评分脚本用）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 两臂报告按 role 后缀区分；显式传路径，避免"读最新那份"掩盖并发写错
      - name: 对当日对照判退化（success_rate 降幅 / 轮数与 token 增幅 >10% 阻断）
        shell: bash
        run: |
          treatment=$(ls -t evals/results/*-treatment.json | head -1)
          control=$(ls -t evals/results/*-control.json | head -1)
          echo "实验臂=$treatment 对照臂=$control"
          node evals/score.mjs "$treatment" "$control"

      - name: 上传本轮报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-results
          # 运行器写的是 evals/results/<epoch>-<pid>-<role>.json；latest.json 从不存在
          path: evals/results/*.json
          if-no-files-found: warn
          retention-days: 30
