name: CI

# 已知 FF 缺口（勿把"CI 全绿"读成 docs/01 §5 七条不变量全部成立）：
#   FF-3 沙箱越界写入探针 src-tauri/tests/sandbox_probe.rs::sandbox_denies_write_outside_workspace
#        已不在 #[ignore] 之列（SH-022 于 2026-11-08 收口），由 cargo test 收集并在本流水线执行；
#   FF-4 sandbox_failclosed.rs、FF-5 latency_budget.rs 已存在并由 cargo test 收集（SH-075）；
#        FF-5 的**真实端点**口径不在本流水线（需密钥与外网），归 .github/workflows/evals.yml；
#   FF-6 审批不可绕过、FF-2 事件 schema 快照、FF-7 前端块冻结由 cargo test / vitest 覆盖。

on:
  push:
  pull_request:
  # 每日一次（UTC 19:00 = 北京 03:00 低峰）：验证"没人动代码时也绿"，专抓随时间漂移的
  # 依赖/环境问题（runner 镜像更新、上游 action 行为变化）。只此一条定时；
  # evals.yml **不加** schedule——它要真实端点与用户 API key，定时就是每天烧钱。
  schedule:
    - cron: '0 19 * * *'

jobs:
  gate:
    # 必须 Windows runner：沙箱实现（受限令牌 / Job Object / deny-ACE）与沙箱探针测试是
    # Win32 专属，Linux runner 连编译都过不去，更谈不上验证 docs/01 §5 的隔离不变量。
    runs-on: windows-latest
    # Windows 冷编译实测 10~15 分钟，给足余量但避免 runner 卡死长期占用
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 不传 version：package.json 的 packageManager 是 pnpm 版本的唯一事实源，
      # 两处各写一份将来只改一处会硬失败
      - uses: pnpm/action-setup@v6

      # 必须显式 pin 版本：AGENTS §6 钉死 Rust 1.99.1，@stable 一旦上游发新 lint，
      # 零代码改动的 PR 也会被 `-D warnings` 判红。
      # 该 action 没有 v1 之类的语义化版本标签，ref 本身就是工具链版本。
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy

      # 放在最前面：纯文本扫描、无编译依赖、秒级完成，契约违规能最快失败并给出人话报错
      - name: 依赖方向检查（FF-1，阈值 0）
        shell: pwsh
        run: |
          # GHA 的 pwsh 步骤自带 $ErrorActionPreference='stop'：脚本语法错误时 `& script`
          # 抛的是终止性错误，会直接中断步骤并返回 1，走不到下面的结束标记判断——
          # 必须用 try/catch 兜住，否则"脚本坏了"会被读成"代码有违规"
          try {
            $out = (& ./scripts/check-deps.ps1 *>&1 | Out-String -Width 400)
            $code = $LASTEXITCODE
          }
          catch {
            $out = "[ci] check-deps 调用抛错（脚本自身错误，不是代码违规）：$($_.Exception.Message)"
            $code = 3
          }
          $out | Write-Host
          # 再兜一层：脚本没跑到结束标记（例如被中途终止）同样视为脚本故障
          if (-not ($out -match '\[check-deps\] (依赖方向检查通过|失败)')) {
            Write-Host '[ci] check-deps 未正常跑完（脚本自身错误，不是代码违规）'
            exit 3
          }
          exit $code

      # ── 文档断言核查（align/doc-claims.md）────────────────────────────────
      # 与下面「上游对齐账本」并列的第二条红线，但放在最前面：与 check-deps 同属纯文本扫描、
      # 无编译依赖、秒级完成，docs 漂移能立刻失败，不必等 clippy/test 十分钟后才暴露。
      # 为什么不塞进 check-deps 或 ledger step：两条红线各自独立，失败时不用读日志就知道是哪一类。
      # 退出码三态照本地契约：0 干净 / 1 有 A 类缺口 / 2 环境不可比。
      # **2 同样判红**：在本仓里 2 只可能是清单缺失、清单格式漂移、源码树没检出、断言引用的
      # 文档文件不存在——全是仓库自身坏了。放过去就等于「缺前置条件静默通过」，是最坏的一种绿。
      # 脚本自身抛错（而非判定失败）走 exit 3，与上面 check-deps 的约定一致。
      - name: 文档断言核查（A 类缺口 / 环境不可比 均红）
        shell: pwsh
        run: |
          # GHA 的 pwsh 步骤自带 $ErrorActionPreference='stop'，脚本抛错会变成终止性错误，
          # 不兜住就会被读成「代码有缺口」——那是两回事，必须分开报
          try {
            $out = (& ./scripts/dev/check-doc-claims.ps1 *>&1 | Out-String -Width 400)
            $code = $LASTEXITCODE
          }
          catch {
            Write-Host "::error title=文档断言核查脚本自身错误::$($_.Exception.Message)"
            exit 3
          }
          $out | Write-Host
          # 缺口逐条生成 annotation：job 摘要里直接看到位置与原句，不用翻日志
          if ($code -eq 1) {
            ($out -split "`n") | Where-Object { $_ -match '^A\t' } | ForEach-Object {
              Write-Host ('::error title=文档断言缺口::' + ($_ -replace "`t", ' '))
            }
          }
          elseif ($code -eq 2) {
            Write-Host '::error title=文档断言核查环境不可比::退出码 2：清单缺失 / 解析 0 行 / 源码树过小 / 清单引用了未知结构检查'
          }
          exit $code

      - name: clippy（告警即失败）
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: 后端测试
        working-directory: src-tauri
        run: cargo test

      # pnpm 在上一步 action 里才装好，此处不能依赖 setup-node 的 pnpm 缓存探测
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端测试
        run: pnpm test

      # ── 上游对齐账本（docs/09）──────────────────────────────────────────
      # 只跑有意义的检查：按冻结基线重新生成 ledger.md，与入库版本比对，不一致即失败。
      # 没有这一步，入库的账本三个月后就是一张过期的漂亮表格——它会继续显示"全绿"，
      # 而真实漂移早已发生。上游必须整棵检出：脚本要统计 packages/ 其它分组的规模，
      # 不能 sparse，所以用 cache 兜住重复成本，key 跟着冻结 commit 走。
      - name: 缓存上游 DSH 检出
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dsh-upstream
          key: ${{ runner.os }}-dsh-upstream-fcc0ad4621

      - name: 上游对齐账本（ledger.md 过期即失败）
        shell: pwsh
        run: |
          $up = Join-Path $env:RUNNER_TEMP 'dsh-upstream'
          if (-not (Test-Path (Join-Path $up '.git'))) {
            # cache 未命中：全量克隆
            git clone --quiet https://github.com/deepseek-ai/deepseek-harness $up
          }
          # 冻结 commit 见 docs/09 §0；上游前进时先改那里，再改这里的两个字面量
          git -C $up fetch --quiet --depth 1 origin fcc0ad462172522aaf5c93a7b2e01f6b9f0b0159
          git -C $up -c advice.detachedHead=false checkout --quiet --force FETCH_HEAD
          $env:DSH_UPSTREAM = $up
          pnpm align:report --check

      # typecheck/test 抓不到 Tailwind/vite 构建期问题，而 tauri.conf.json 的 frontendDist
      # 指向 dist：构建链断裂不该等到打包阶段才暴露。
      # `pnpm build` = `pnpm typecheck && vite build && check-dist-assets`，typecheck 已含在内，
      # 不再单独跑一步（重复跑只会把同一条 tsc 走两遍）。
      - name: 前端构建
        run: pnpm build

  # 产物级冒烟：必须跑在 release 主程序上。dev server 不经过 Tauri 资源协议、CSP 头与
  # /api/file 媒体路由，unit/vitest 也覆盖不到，所以这一层单独一个 job。
  #
  # 与 gate 并行（不写 needs）：墙钟 ≈ max(gate 约 11 分钟, 本 job 约 13 分钟)，
  # 串行会直接叠加到 25 分钟以上。runner 分钟数增加约一倍，换取"每次推送都验证安装形态"。
  product-smoke:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6

      - uses: dtolnay/rust-toolchain@1.99.1

      # 主程序编译是这条流水线的大头；缓存后同一 Cargo.lock 的二次运行约 4~6 分钟。
      # 依赖或代码一变 key 就变，宁可重编也不跑旧产物。
      - name: 缓存 cargo 构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 只要主程序，不产安装器：冒烟验证的是资源协议/CSP/媒体路由，与 MSI 无关，
      # 省掉 WiX 打包时间
      - name: 构建 release 主程序（不打包安装器）
        run: pnpm tauri build --no-bundle

      # 四项只留最贵的：首屏、消息收发（本地 stub，不烧真 key）、/api/file 出图、PDF 出页
      - name: 产物级冒烟（CDP 驱动 release 主程序）
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/shaniu.exe'
          if (-not (Test-Path $exe)) { throw "release 主程序不存在：$exe" }
          node scripts/smoke/run-smoke.mjs --exe $exe --out smoke-out

      # 只为把抖动当场固定住：进程还活着吗、WebView2 什么版本、系统有没有记录崩溃。
      # 必须排在「失败时留证据」之前，产物才收得到；continue-on-error 保证它自己出错
      # 也不改变 job 结论（结论只由冒烟那一步决定，这里不写任何判据）。
      - name: 失败时抓运行时状态
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force smoke-out | Out-Null
          $out = 'smoke-out/runtime-diagnostics.txt'
          "采集时间: $(Get-Date -Format o)" | Out-File $out -Encoding utf8

          '' | Out-File $out -Append -Encoding utf8
          '## 主程序进程（shaniu.exe）' | Out-File $out -Append -Encoding utf8
          $procs = Get-Process shaniu -ErrorAction SilentlyContinue
          if ($procs) {
            $procs |
              Select-Object Id, StartTime, Responding, MainWindowTitle, CPU |
              Format-List |
              Out-String | Out-File $out -Append -Encoding utf8
          } else {
            '未发现 shaniu 进程：主程序在冒烟结束前已退出（对照 app.log / shaniu.log 定位退出点）' |
              Out-File $out -Append -Encoding utf8
          }

          '' | Out-File $out -Append -Encoding utf8
          '## Edge WebView2 运行时版本' | Out-File $out -Append -Encoding utf8
          $roots = @(
            'C:\Program Files (x86)\Microsoft\EdgeWebView\Application',
            'C:\Program Files\Microsoft\EdgeWebView\Application'
          )
          $found = $false
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            foreach ($dir in Get-ChildItem $root -Directory -ErrorAction SilentlyContinue) {
              $exe = Join-Path $dir.FullName 'msedgewebview2.exe'
              if (Test-Path $exe) {
                $found = $true
                "$($dir.Name) -> $((Get-Item $exe).VersionInfo.FileVersion)" |
                  Out-File $out -Append -Encoding utf8
              }
            }
          }
          if (-not $found) { '未找到 WebView2 运行时目录或 msedgewebview2.exe' | Out-File $out -Append -Encoding utf8 }

          '' | Out-File $out -Append -Encoding utf8
          '## 系统 Application 日志（最近 20 分钟，错误级 = Level 2）' | Out-File $out -Append -Encoding utf8
          try {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-20) } -ErrorAction Stop |
              Where-Object { $_.Level -eq 2 } |
              Select-Object -First 30 TimeCreated, Id, ProviderName,
                @{ n = 'Message'; e = { (($_.Message -split "`r?`n") | Select-Object -First 4) -join ' | ' } } |
              Format-List |
              Out-String | Out-File $out -Append -Encoding utf8
          } catch {
            "读取 Application 日志失败：$($_.Exception.Message)" | Out-File $out -Append -Encoding utf8
          }

      - name: 失败时留证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-smoke-evidence
          path: smoke-out
          if-no-files-found: ignore
